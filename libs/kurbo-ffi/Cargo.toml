[package]
name = "kurbo-ffi"
version = "0.2.0"
rust-version = "1.88.0"
edition = "2024"
authors = ["Daan de Lange"]
description = "C++ Wrapper for kurbo"
license = "MIT"
keywords = ["kurbo", "curve", "geometry", "2d", "graphics", "bezier"]
categories = ["graphics", "mathematics"]
homepage = "https://github.com/daandelange/ofxKurbo"
repository = "https://github.com/daandelange/ofxKurbo"

[dependencies]
kurbo = "0.13.1"
vector-types = { git = "https://github.com/GraphiteEditor/Graphite.git", package = "vector-types", default-features = false, features = ["serde"] }
linesweeper = "0.4.0"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = true
debug = 0
strip = true
codegen-units = 1
panic = "unwind"
